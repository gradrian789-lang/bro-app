<html lang="de">
<head>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surface:#F0F2F5;--ink:#1C1E21;--mute:#65676B;--free:#25D366;--busy:#FA383E;--maybe:#F7B928;--line:#DADDE1;--accent:#0866FF;--on-ink:#F0F2F5;--on-accent:#fff;--chatbg:#EFEAE2;--bme:#D9FDD3;--bme-t:#1C1E21;--bother:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18191A;--surface:#242526;--ink:#E4E6EB;--mute:#B0B3B8;--free:#31D07A;--busy:#FF6B70;--maybe:#F7B928;--line:#3E4042;--accent:#2374E1;--on-ink:#18191A;--on-accent:#fff;--chatbg:#0B141A;--bme:#005C4B;--bme-t:#E4E6EB;--bother:#242526;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#18191A;--surface:#242526;--ink:#E4E6EB;--mute:#B0B3B8;--free:#31D07A;--busy:#FF6B70;--maybe:#F7B928;--line:#3E4042;--accent:#2374E1;--on-ink:#18191A;--on-accent:#fff;--chatbg:#0B141A;--bme:#005C4B;--bme-t:#E4E6EB;--bother:#242526;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px;line-height:1.4}
button{font-family:inherit}
button:disabled{opacity:.6}
.app{max-width:480px;margin:0 auto;padding:20px 20px 100px}
.logo{font-weight:800;font-size:34px;letter-spacing:-.03em;margin:0 0 2px}
.sub{color:var(--mute);margin:0 0 14px}
h2{font-size:19px;font-weight:800;margin:26px 0 8px}
.hero{display:flex;flex-direction:column;align-items:center;margin:8px 0}
.big{width:236px;height:236px;border-radius:50%;border:0;background:linear-gradient(135deg,#DD2A7B,#8134AF,#515BD4);color:#fff;font:800 33px/1.05 'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.02em;cursor:pointer;transition:background .25s,box-shadow .25s,transform .1s;box-shadow:0 0 0 10px rgba(221,42,123,.18)}
.big:active{transform:scale(.96)}
.big.on{background:var(--free);color:#06281C;box-shadow:0 0 0 14px color-mix(in srgb,var(--free) 25%,transparent)}
.big small{display:block;font:400 14px/1.3 'Bricolage Grotesque',system-ui,sans-serif;margin-top:8px;letter-spacing:0}
.status{margin:22px 0 0;font-weight:600;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 0}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;padding:8px 14px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lbl{color:var(--mute);font-size:14px;margin:16px 0 0}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;border:3px solid var(--busy)}
.av.free{border-color:var(--free)}
.av.maybe{border-color:var(--maybe)}
.av.off{border-color:var(--line)}
.sd{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--busy)}
.sd.free{background:var(--free)}
.sd.maybe{background:var(--maybe)}
.row b{font-weight:600}
.row .m{color:var(--mute);margin-left:auto;font-size:14px;text-align:right}
.btn{border:2px solid var(--ink);background:transparent;color:var(--ink);font-weight:600;font-size:15px;padding:10px 16px;border-radius:999px;cursor:pointer}
.btn.fill{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.x{border:0;padding:4px 10px;font-size:22px;color:var(--mute)}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.f{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.tr{display:flex;gap:8px;align-items:center}
.tr input{flex:1}
.note{color:var(--mute);font-size:14px;margin:14px 0 0}
.code{font-weight:800;font-size:28px;letter-spacing:.06em;margin:10px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tr span{min-width:96px;font-weight:600}
.tl{position:relative;height:34px;border-radius:12px;background:var(--surface);border:1px solid var(--line);overflow:hidden;margin:10px 0 4px}
.tl i{position:absolute;top:0;bottom:0;opacity:.88}
.tl u{position:absolute;top:0;bottom:0;width:3px;background:var(--ink);text-decoration:none}
.ticks{display:flex;justify-content:space-between;color:var(--mute);font-size:12px}
.ev{display:flex;align-items:center;gap:12px;padding:12px 8px 12px 14px;margin-top:10px;background:var(--surface);border-radius:14px;border-left:6px solid var(--accent)}
.ev .t{font-weight:800;font-size:15px;min-width:104px}
#fx{position:fixed;inset:0;pointer-events:none;display:grid;place-items:center;z-index:30}
.fxi{grid-area:1/1;font-size:76px;line-height:1;opacity:0}
.fx-fly{animation:fxfly 1.6s ease-in-out forwards}
.fx-wob{animation:fxwob 1.6s ease-in-out forwards}
.fx-pul{animation:fxpul 1.6s ease-in-out forwards}
@keyframes fxfly{0%{opacity:0;transform:translate(-130px,50px) scale(.5) rotate(0)}15%{opacity:1}50%{transform:translate(0,-70px) scale(1.2) rotate(220deg)}85%{opacity:1}100%{opacity:0;transform:translate(130px,50px) scale(.5) rotate(440deg)}}
@keyframes fxwob{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.1)}30%{transform:rotate(-14deg)}45%{transform:rotate(14deg)}60%{transform:rotate(-9deg)}75%{opacity:1;transform:rotate(6deg) scale(1)}100%{opacity:0;transform:scale(1) translateY(-30px)}}
@keyframes fxpul{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.3) rotate(-8deg)}35%{transform:scale(1) rotate(8deg)}55%{transform:scale(1.25) rotate(-6deg)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#fx{display:none}}
nav div{display:flex;width:100%;max-width:480px}
nav button{flex:1;border:0;background:none;color:var(--mute);font-weight:600;font-size:15px;padding:16px 0;cursor:pointer;border-top:3px solid transparent}
nav button.on{color:var(--ink);border-top-color:var(--accent)}
#push{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);max-width:456px;margin:0 auto;background:var(--ink);color:var(--on-ink);border-radius:18px;padding:16px;transform:translateY(-170%);transition:transform .35s;z-index:20}
#push.on{transform:none}
#push .btn{color:var(--on-ink);border-color:var(--on-ink);margin:10px 8px 0 0}
#push .btn.fill{background:var(--free);border-color:var(--free);color:#06281C}
#toast{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:18px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92%;text-align:center;z-index:20;font-weight:600}
#toast.on{opacity:1}
.big.sm{width:116px;height:116px;padding:0;font-size:22px;flex:none;box-shadow:0 0 0 7px rgba(221,42,123,.18)}
.big.sm.on{box-shadow:0 0 0 7px color-mix(in srgb,var(--free) 25%,transparent)}
.qr{background:#fff;padding:12px;border-radius:12px;width:210px;margin:12px auto}
.qr svg{display:block;width:100%;height:auto}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;padding:10px 0 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="push"></div>

<nav style="display:none"><div id="tabs"></div></nav>

<div id="fx" aria-hidden="true"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,EmailAuthProvider,reauthenticateWithCredential,updatePassword,verifyBeforeUpdateEmail,deleteUser} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot,collection,query,where,getDocs} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyB6vuyXVphxOAvsJ8fYi0zriwvMLwxt0o4",
  authDomain:"bro-app-b1e03.firebaseapp.com",
  projectId:"bro-app-b1e03",
  storageBucket:"bro-app-b1e03.firebasestorage.app",
  messagingSenderId:"1010750335719",
  appId:"1:1010750335719:web:e96c02ac21a74d38d69042"
});
const auth=getAuth(app),db=getFirestore(app);

const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ACTS=['Egal','Kaffee','Sport','Zocken','Essen','Chillen'],ACTI=[['Egal','🙂'],['Kaffee','☕'],['Sport','🏋️'],['Fußball','⚽'],['Zocken','🎮'],['Essen','🍕'],['Chillen','🛋️']],EMO=['🙂','☕','🏋️','🎮','🍕','🛋️','🎬','🍻','🚶','🎲','📚','🎵','⚽'],DURS=[[60,'1 Std'],[120,'2 Std'],[240,'4 Std'],[0,'Offen']],COL=['#5B3FD9','#C2418D','#2A7FBA','#B4691F','#3E8E5A'];
const actOf=d=>d.actLabel||(d.act>0?ACTS[d.act]:'');
const hm=ms=>new Date(ms).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const S={user:null,me:null,fr:{},pairs:{},replies:[],series:[],ex:{},calLoaded:false,customs:[],addingAct:false,meets:[],laterOpen:false,lDay:'today',lTime:'',ans:{},showExp:false,events:[],votes:{},evAdding:false,evf:null,reqIn:[],reqOut:[],chatWith:null,chats:[],msgs:[],chatDraft:'',cats:[],catName:'',pings:{},showQr:false,pendingAdd:'',pwCur:'',pwNew:'',emNew:'',pwDel:'',setName:'',delOpen:false,newActL:'',newActI:'🙂',wk:0,sel:null,adding:false,fmode:'once',f:{},addDays:[],del:null,tab:'home',dur:120,act:0,mode:'login',err:'',busy:false,em:'',pw:'',nm:'',codeIn:'',ready:false,banner:null};
let unsubs=[],fl={};
try{const q=new URLSearchParams(location.search).get('add');if(q){S.pendingAdd=q;history.replaceState(null,'',location.pathname)}}catch(e){}

const blockOf=d=>{const n=Date.now();return ((d&&d.busy)||[]).find(b=>b.s<=n&&n<b.e)};
const eff=d=>{if(!d)return 'maybe';const n=Date.now();if(d.status==='free'&&!(d.freeUntil&&n>d.freeUntil))return 'free';if(d.status==='busy')return 'busy';return blockOf(d)?'busy':'maybe'};
const av=(n,s,ph,sz)=>{sz=sz||42;return'<span class="av '+s+'" style="width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz*.4)+'px;'+(ph?'background:#ccc url('+ph+') center/cover':'background:'+COL[(n||'?').charCodeAt(0)%COL.length])+'">'+(ph?'':esc((n||'?')[0].toUpperCase()))+'</span>'};
const stText=d=>{const s=eff(d);return s==='free'?'Verfügbar'+(d.freeUntil?' bis '+hm(d.freeUntil):'')+(actOf(d)?', Lust auf '+(d.actIcon?d.actIcon+' ':'')+actOf(d):''):s==='busy'?(d.status!=='busy'&&blockOf(d)?'Beschäftigt bis '+hm(blockOf(d).e):'Beschäftigt'):'Eventuell verfügbar'};
const chips=(list,cur,a)=>'<div class="chips">'+list.map((x,i)=>{const k=typeof x==='string'?i:x[0],l=typeof x==='string'?x:x[1];return'<button class="chip'+(k===cur?' on':'')+'" data-a="'+a+'" data-v="'+k+'">'+l+'</button>'}).join('')+'</div>';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2800)}
const gen=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='BRO-';for(let i=0;i<4;i++)c+=a[Math.floor(Math.random()*a.length)];return c};

/* Kalender */
const DN=['Mo','Di','Mi','Do','Fr','Sa','So'],DNL=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'],SC={F:'#2A7FBA',S:'#B4691F',N:'#5B3FD9'};
const ds=d=>d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
const pd=s=>{const p=s.split('-');return new Date(+p[0],p[1]-1,+p[2])};
const addD=(d,k)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+k);return x};
const dayIdx=d=>(d.getDay()+6)%7;
const mins=t=>{const p=t.split(':');return +p[0]*60+ +p[1]};
const fmtD=d=>d.toLocaleDateString('de-DE',{day:'numeric',month:'short'});
let lastBusy='';

function startsBase(d){
  const k=ds(d),r=[];
  S.series.forEach(x=>{
    if(k<x.from||(x.until&&k>x.until)||(S.ex[x.id]||[]).indexOf(k)>-1)return;
    let t,n=x.n,c='';
    if(x.kind==='once'){if(k!==x.from)return;t=[x.s,x.e]}
    else if(x.kind==='week'){if(x.days.indexOf(dayIdx(d))<0)return;t=[x.s,x.e]}
    else{c=x.cycle[Math.round((pd(k)-pd(x.from))/864e5)%x.cycle.length];if(c==='-')return;const y=x.times[c];t=[y.s,y.e];n=y.n}
    r.push({x:x,n:n,c:c,s:t[0],e:t[1],k:k});
  });
  return r;
}
function dayList(d){
  const r=[];
  starts(d).forEach(o=>{const a=mins(o.s),b=mins(o.e);r.push({o:o,from:a,to:b>a?b:1440,ts:o.s,te:b>a?o.e:'24:00'})});
  starts(addD(d,-1)).forEach(o=>{const a=mins(o.s),b=mins(o.e);if(b<a)r.push({o:o,from:0,to:b,ts:'00:00',te:o.e})});
  return r.sort((x,y)=>x.from-y.from);
}
/* Nur Zeitblöcke ohne Namen werden mit den Homies geteilt */
function busyBlocks(){
  const t0=addD(new Date(),0),r=[];
  for(let i=0;i<14;i++){
    const d=addD(t0,i);
    dayList(d).forEach(l=>r.push({s:new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,l.from).getTime(),e:new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,l.to).getTime()}));
  }
  r.sort((a,b)=>a.s-b.s);
  const m=[];
  r.forEach(b=>{const l=m[m.length-1];if(l&&b.s<=l.e)l.e=Math.max(l.e,b.e);else m.push({s:b.s,e:b.e})});
  return m.filter(b=>b.e>Date.now());
}
async function syncBusy(){
  if(!S.user||!S.calLoaded)return;
  const b=busyBlocks(),j=JSON.stringify(b);
  if(j===lastBusy)return;
  lastBusy=j;
  try{await updateDoc(doc(db,'users',S.user.uid),{busy:b})}catch(e){console.warn(e);lastBusy=''}
}
async function saveCal(){
  await setDoc(doc(db,'users',S.user.uid,'private','calendar'),{series:S.series,ex:S.ex});
  await syncBusy();
}
setInterval(syncBusy,3600000);

function viewDate(){const now=new Date();return addD(now,-dayIdx(now)+7*S.wk+(S.sel==null?dayIdx(now):S.sel))}
function openForm(mode,n){
  const d=viewDate(),f={n:n||'',s:'09:00',e:'17:00',until:'',cyc:'FFSSNN----',fs:'06:00',fe:'14:00',ss:'14:00',se:'22:00',ns:'22:00',ne:'06:00',start:ds(d)};
  S.addDays=[dayIdx(d)];
  if(n==='Sport'){f.s='18:00';f.e='19:30'}
  if(n==='Schlafen'){f.s='22:00';f.e='07:00';S.addDays=[0,1,2,3,4,5,6]}
  S.f=f;S.fmode=mode;S.adding=true;render();
}
async function saveEvent(){
  const f=S.f,id='s'+Date.now(),now=new Date(),mon=addD(now,-dayIdx(now)+7*S.wk);
  if(S.fmode==='shift'){
    const cyc=f.cyc.toUpperCase().replace(/[^FSN]/g,'-');
    if(!/[FSN]/.test(cyc)||!f.start){toast('Bitte Muster und Startdatum angeben');return}
    if(!f.fs||!f.fe||!f.ss||!f.se||!f.ns||!f.ne){toast('Bitte alle Schichtzeiten ausfüllen');return}
    S.series.push({id:id,kind:'shift',n:'Schichtplan',from:f.start,cycle:cyc.split(''),times:{F:{n:'Frühschicht',s:f.fs,e:f.fe},S:{n:'Spätschicht',s:f.ss,e:f.se},N:{n:'Nachtschicht',s:f.ns,e:f.ne}}});
  }else{
    if(!f.n.trim()||!f.s||!f.e||f.s===f.e){toast('Bitte Name und gültige Zeit eintragen');return}
    const x={id:id,n:f.n.trim(),s:f.s,e:f.e};
    if(S.fmode==='once'){x.kind='once';x.from=ds(viewDate())}
    else{if(!S.addDays.length){toast('Bitte mindestens einen Tag wählen');return}x.kind='week';x.days=S.addDays.slice();x.from=ds(mon);x.until=f.until||''}
    S.series.push(x);
  }
  S.adding=false;render();
  await saveCal();
  toast(S.fmode==='once'?'Termin gespeichert':'Serie gespeichert');
}
async function delOcc(v){
  const p=v.split('|'),x=S.series.filter(s=>s.id===p[0])[0];
  if(x&&x.kind==='once')return delSeries(p[0]);
  S.del=v;render();
}
async function skipOcc(v){
  const p=v.split('|');
  (S.ex[p[0]]=S.ex[p[0]]||[]).push(p[1]);
  S.del=null;render();
  await saveCal();toast('Termin gelöscht, Serie bleibt');
}
async function delSeries(id){
  S.series=S.series.filter(s=>s.id!==id);delete S.ex[id];S.del=null;render();
  await saveCal();toast('Gelöscht');
}
function rule(x){
  if(x.kind==='shift')return'Schichtplan ab '+fmtD(pd(x.from))+': '+x.cycle.join(' ');
  const a=x.days.slice().sort(),s=a.join();
  return(a.length===7?'Täglich':s==='0,1,2,3,4'?'Mo–Fr':s==='5,6'?'Wochenende':a.map(i=>DN[i]).join(', '))+', '+x.s+'–'+x.e+(x.until?', bis '+fmtD(pd(x.until)):'');
}
function formView(){
  const f=S.f,m=S.fmode;
  const inp=(k,t,ph)=>'<input type="'+t+'" value="'+esc(f[k]||'')+'" placeholder="'+(ph||'')+'" data-k="f.'+k+'">';
  const tr=(l,a,b)=>'<div class="tr"><span>'+l+'</span>'+inp(a,'time')+inp(b,'time')+'</div>';
  let h='<div class="f"><div class="chips" style="margin:0">'+[['once','Einmalig'],['series','Serie'],['shift','Schichtplan']].map(x=>'<button class="chip'+(m===x[0]?' on':'')+'" data-a="fmode" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
  if(m==='shift'){
    h+='<p class="note" style="margin:0">Muster wählen oder selbst tippen: F = Früh, S = Spät, N = Nacht, – = frei. Jeder Buchstabe steht für einen Tag.</p><div class="chips" style="margin:0">'+[['FFSSNN----','Wechselschicht'],['FFFFF--SSSSS--','Früh/Spät wöchentlich'],['NNNN---','Nacht 4/3']].map(c=>'<button class="chip'+(f.cyc===c[0]?' on':'')+'" data-a="cyc" data-v="'+c[0]+'">'+c[1]+'</button>').join('')+'</div>'+
      inp('cyc','text','Muster')+'<div class="tr"><span>Erster Tag</span>'+inp('start','date')+'</div>'+tr('Früh','fs','fe')+tr('Spät','ss','se')+tr('Nacht','ns','ne');
  }else{
    h+=inp('n','text','Name, zum Beispiel Uni')+tr('Zeit','s','e');
    if(m==='series')h+='<div class="chips" style="margin:0">'+DN.map((x,i)=>'<button class="chip'+(S.addDays.indexOf(i)>-1?' on':'')+'" style="padding:8px 11px" data-a="tgl" data-v="'+i+'">'+x+'</button>').join('')+'</div><div class="tr"><span>Bis (optional)</span>'+inp('until','date')+'</div>';
  }
  return h+'<div class="tr"><button class="btn fill" data-a="save">Speichern</button><button class="btn" data-a="close">Abbrechen</button></div></div>';
}
function calView(){

async function reauth(pw){

async function deleteAccount(){
  let stopped=false;
  try{
    const u=await reauth(S.pwDel),uid=u.uid;
    if(!confirm('Konto wirklich endgültig löschen? Das lässt sich nicht rückgängig machen.'))return;
    stopListeners();stopped=true;
    const friends=Object.keys(S.pairs),pairs=Object.values(S.pairs),reps=S.replies.map(r=>r.id),code=S.me.code;
    for(const id of friends){try{await deleteDoc(doc(db,'users',id,'replies',uid))}catch(e){console.warn(e)}try{await deleteDoc(doc(db,'users',uid,'pings',id))}catch(e){console.warn(e)}}
    for(const c of S.chats){try{const sn=await getDocs(collection(db,'chats',c.id,'messages'));for(const d of sn.docs)if(d.data().from===uid)await deleteDoc(doc(db,'chats',c.id,'messages',d.id));await deleteDoc(doc(db,'chats',c.id))}catch(e){console.warn(e)}}
    for(const r of S.reqIn.concat(S.reqOut)){try{await deleteDoc(doc(db,'friendRequests',r.id))}catch(e){console.warn(e)}}
    for(const pid of pairs)await deleteDoc(doc(db,'friendships',pid));
    for(const id of reps)await deleteDoc(doc(db,'users',uid,'replies',id));
    for(const e of S.events){
      if(e.hostId===uid){for(const k of Object.keys(S.votes[e.id]||{}))await deleteDoc(doc(db,'events',e.id,'votes',k));await deleteDoc(doc(db,'events',e.id))}
      else await deleteDoc(doc(db,'events',e.id,'votes',uid));
    }
    await deleteDoc(doc(db,'users',uid,'private','calendar'));
    await deleteDoc(doc(db,'users',uid,'private','prefs'));
    await deleteDoc(doc(db,'codes',code));
    await deleteDoc(doc(db,'users',uid));
    await deleteUser(u);
    toast('Dein Konto wurde gelöscht');
  }catch(e){
    console.error(e);toast(errMsg(e));
    if(stopped&&auth.currentUser)listen(auth.currentUser);
  }
}

/* Später zusagen und Verabredungen */
let seenAcc=new Set(),repliesReady=false;
function dayLabel(t){
  const d=new Date(t),n=new Date(),k=ds(d);
  const lab=k===ds(n)?'heute':k===ds(addD(n,1))?'morgen':d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'numeric'});
  return lab+' '+hm(t);
}
function onReplies(snap,u){
  S.replies=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
  S.replies.forEach(r=>{
    const key=(r.kind||'r')+'|'+r.id+'|'+(r.later||r.t||'');
    if(seenAcc.has(key))return;
    seenAcc.add(key);
    if(repliesReady){
      if(r.kind==='acc')toast(r.name+' sagt zu: '+dayLabel(r.t));
      else if(r.kind==='dec')toast(r.name+' kann leider nicht: '+dayLabel(r.t));
      else if(r.later)toast(r.name+' schlägt '+dayLabel(r.later)+' vor');
    }
    if(r.kind==='dec'&&repliesReady)deleteDoc(doc(db,'users',u.uid,'replies',r.id)).catch(()=>{});
  });
  repliesReady=true;render();
}
function openLater(){
  const d=new Date(Date.now()+2*3600000);
  d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0);
  if(d.getDate()!==new Date().getDate()){S.lDay='tomorrow';S.lTime='18:00'}
  else{S.lDay='today';S.lTime=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}

/* Homie-Anfragen */
function onReq(s){
  const prev=S.reqIn.map(r=>r.id);
  S.reqIn=s.docs.map(d=>Object.assign({id:d.id},d.data()));
  if(reqReady)S.reqIn.forEach(r=>{if(prev.indexOf(r.id)<0)toast(r.fromName+' möchte dein Homie sein')});
  reqReady=true;render();
}
async function acceptReq(from){
  const ids=[S.user.uid,from].sort();
  await setDoc(doc(db,'friendships',ids.join('_')),{members:ids});
  await deleteDoc(doc(db,'friendRequests',from+'_'+S.user.uid));
  const r=S.reqIn.filter(x=>x.from===from)[0];
  toast((r?r.fromName:'Dein Homie')+' ist jetzt dein Homie');
}
async function rejectReq(from){await deleteDoc(doc(db,'friendRequests',from+'_'+S.user.uid));toast('Anfrage abgelehnt')}
async function withdrawReq(to){await deleteDoc(doc(db,'friendRequests',S.user.uid+'_'+to));toast('Anfrage zurückgezogen')}
async function addHomie(){
  let code=S.codeIn.trim().toUpperCase();if(!code)return;
  if(code.indexOf('BRO-')!==0)code='BRO-'+code;
  const c=await getDoc(doc(db,'codes',code));
  if(!c.exists()){toast('Diesen Code gibt es nicht');return}
  const o=c.data().uid,me=S.user.uid;
  if(o===me){toast('Das ist dein eigener Code');return}
  if(S.pairs[o]){toast('Ihr seid schon verbunden');return}
  if(S.reqIn.some(r=>r.from===o)){await acceptReq(o);S.codeIn='';return}
  if(S.reqOut.some(r=>r.to===o)){toast('Die Anfrage an '+c.data().name+' läuft schon');return}
  await setDoc(doc(db,'friendRequests',me+'_'+o),{from:me,to:o,fromName:S.me.name,toName:c.data().name,at:Date.now()});
  S.codeIn='';render();toast('Anfrage an '+c.data().name+' gesendet');
}

/* Kategorien und gezielte Anfragen */
function audienceFor(label){
  if(!S.cats.length)return{filtered:false,ids:[]};
  const ids=Object.keys(S.pairs).filter(id=>{
    const mine=S.cats.filter(c=>(c.m||[]).indexOf(id)>-1);
    if(!mine.length)return true;
    return mine.some(c=>!(c.a||[]).length||!label||c.a.indexOf(label)>-1);
  });
  return{filtered:true,ids:ids};
}
const splitKey=v=>{const i=v.indexOf('|');return[v.slice(0,i),v.slice(i+1)]};
function catAdd(){
  const n=S.catName.trim();
  if(!n){toast('Bitte einen Namen eingeben');return}
  S.cats.push({id:'c'+Date.now(),n:n.slice(0,24),m:[],a:[]});S.catName='';render();return savePrefs();
}
function catDel(id){S.cats=S.cats.filter(c=>c.id!==id);render();return savePrefs()}
function catToggle(v,key){
  const p=splitKey(v),c=S.cats.filter(x=>x.id===p[0])[0];if(!c)return;
  const a=c[key]=c[key]||[],k=a.indexOf(p[1]);
  if(k>-1)a.splice(k,1);else a.push(p[1]);
  render();return savePrefs();
}
function catSection(){
  const ids=Object.keys(S.pairs),acts=allActs().map(a=>a[0]).filter(l=>l!=='Egal');
  let h='<h2>Kategorien</h2><p class="note" style="margin-top:0">Teile Homies in Gruppen ein und lege fest, bei welchen Aktivitäten sie von dir angepingt werden. Homies ohne Gruppe bekommen jede Anfrage.</p>';
  h+=S.cats.map(c=>'<div style="border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px"><div class="tr" style="justify-content:space-between"><b>'+esc(c.n)+'</b><button class="btn x" style="font-size:14px;color:var(--busy)" data-a="catdel" data-v="'+c.id+'">Löschen</button></div><p class="note" style="margin:6px 0 0">Wer gehört dazu?</p><div class="chips">'+(ids.length?ids.map(id=>'<button class="chip'+((c.m||[]).indexOf(id)>-1?' on':'')+'" data-a="cattm" data-v="'+c.id+'|'+id+'">'+esc((S.fr[id]||{name:'…'}).name)+'</button>').join(''):'<span class="note">Noch keine Homies.</span>')+'</div><p class="note" style="margin:10px 0 0">Wobei anpingen? Nichts gewählt heißt bei allem.</p><div class="chips">'+acts.map(l=>'<button class="chip'+((c.a||[]).indexOf(l)>-1?' on':'')+'" data-a="catta" data-v="'+c.id+'|'+esc(l)+'">'+esc(l)+'</button>').join('')+'</div></div>').join('');
  return h+'<div class="tr" style="margin-top:12px"><input data-k="catName" maxlength="24" placeholder="Neue Gruppe, zum Beispiel Sport" value="'+esc(S.catName)+'"><button class="btn fill" data-a="catadd">Hinzufügen</button></div>';

/* Profilbild */
function readPhoto(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const m=Math.min(img.width,img.height);c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,160,160);res(c.toDataURL('image/jpeg',0.8))};img.onerror=rej;img.src=fr.result};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}
async function setPhoto(file){
  if(!file)return;
  try{const d=await readPhoto(file);await updateDoc(doc(db,'users',S.user.uid),{photo:d});toast('Profilbild gespeichert')}
  catch(e){console.warn(e);toast('Das Bild konnte nicht gelesen werden')}
}
document.addEventListener('change',e=>{if(e.target.id==='photoIn')setPhoto(e.target.files[0])});
function photoSection(){
  const me=S.me;
  return'<h2>Profilbild</h2><div class="tr" style="gap:14px">'+av(me.name,'free',me.photo,64)+'<label class="btn fill" for="photoIn" style="cursor:pointer">Bild wählen</label><input id="photoIn" type="file" accept="image/*" style="display:none">'+(me.photo?'<button class="btn x" style="font-size:14px" data-a="photodel">Entfernen</button>':'')+'</div>';
}

/* QR-Code und Einladungslink */
const inviteLink=()=>location.origin+location.pathname+'?add='+S.me.code;
function qrSvg(text){
  try{if(!window.qrcode)return'';const q=window.qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:5,margin:0,scalable:true})}
  catch(e){console.warn(e);return''}
}
async function shareInvite(){
  const l=inviteLink();
  if(navigator.share){try{await navigator.share({title:'Bro',text:'Komm zu Bro! Mein Code: '+S.me.code,url:l});return}catch(e){}}
  try{await navigator.clipboard.writeText(l);toast('Einladungslink kopiert')}catch(e){toast(l)}
}

/* Chat */
function onChats(s,u){
  const prev=S.chats;
  S.chats=s.docs.map(d=>Object.assign({id:d.id},d.data()));
  if(chatsReady)S.chats.forEach(c=>{
    const o=c.members.find(m=>m!==u.uid),old=prev.filter(x=>x.id===c.id)[0];
    if(c.last&&c.last.from!==u.uid&&(!old||!old.last||old.last.at!==c.last.at)&&S.chatWith!==o)toast((S.fr[o]?S.fr[o].name:'Neue Nachricht')+': '+c.last.text);
  });
  chatsReady=true;render();
}
function markRead(o){
  const c=S.chats.filter(x=>x.id===pairOf(o))[0];
  if(c&&unreadOf(c))setDoc(doc(db,'chats',c.id),{r:{[S.user.uid]:Date.now()}},{merge:true}).catch(()=>{});
}
function openChat(o){
  if(!o)return;
  if(chatUnsub){chatUnsub();chatUnsub=null}
  S.chatWith=o;S.msgs=[];S.tab='chat';
  chatUnsub=onSnapshot(collection(db,'chats',pairOf(o),'messages'),s=>{
    S.msgs=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>a.at-b.at);
    render();window.scrollTo(0,document.body.scrollHeight);markRead(o);
  },e=>console.warn(e));
  render();
}
function closeChat(){if(chatUnsub){chatUnsub();chatUnsub=null}S.chatWith=null;S.tab='chats';render()}
async function sendMsg(t){
  t=(t||'').trim();
  if(!t||!S.chatWith)return;
  const o=S.chatWith,pid=pairOf(o),me=S.user.uid,now=Date.now(),id='m'+now+Math.random().toString(36).slice(2,6);
  S.chatDraft='';
  await setDoc(doc(db,'chats',pid,'messages',id),{from:me,text:t.slice(0,500),at:now});
  await setDoc(doc(db,'chats',pid),{members:[me,o].sort(),last:{text:t.slice(0,80),from:me,at:now},r:{[me]:now}},{merge:true});
}

  if(!S.ready){v.innerHTML='<p class="note">Lädt …</p>';return}
  $('nav').style.display=S.user&&S.tab!=='chat'?'':'none';

      '<input data-k="pw" type="password" placeholder="Passwort (mindestens 6 Zeichen)" value="'+esc(S.pw)+'" autocomplete="'+(S.mode==='reg'?'new-password':'current-password')+'">'+

      '<button class="btn fill" data-a="submit"'+(S.busy?' disabled':'')+'>'+(S.mode==='reg'?'Registrieren':'Anmelden')+'</button>'+
      (S.mode==='login'?'<button class="btn x" style="font-size:15px" data-a="reset">Passwort vergessen?</button>':'')+'<button class="btn x" style="font-size:15px" data-a="mode">'+(S.mode==='reg'?'Schon ein Konto? Anmelden':'Neu hier? Konto erstellen')+'</button></div>';
    return;
  }
  const me=S.me;
  if(!me){v.innerHTML='<h1 class="logo">bro</h1><p class="note">'+esc(S.err||'Profil wird eingerichtet …')+'</p><button class="btn" data-a="out">Abmelden</button>';return}
  const s=eff(me),foc=document.activeElement&&document.activeElement.id==='msgIn';

  if(foc){const i=document.getElementById('msgIn');if(i){i.focus();try{i.setSelectionRange(i.value.length,i.value.length)}catch(e){}}}
  const un=S.chats.filter(unreadOf).length;
  $('#tabs').innerHTML=[['home','Start'],['friends','Homies'],['events','Events'],['cal','Kalender'],['chats','Chats']].map(t=>'<button class="'+(S.tab===t[0]||(t[0]==='chats'&&S.tab==='chat')?'on':'')+'" data-a="tab" data-v="'+t[0]+'">'+navIcon(t[0])+'<span>'+t[1]+(t[0]==='chats'&&un?' <i class="sd" style="margin:0 0 0 2px"></i>':'')+'</span></button>').join('');
}
render();
</script>
</body>
